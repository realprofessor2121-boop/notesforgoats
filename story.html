<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Class Story | Notes For Goats</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--ink:#f4f4f4;--page:#0a0a0a}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Poppins',sans-serif;background:var(--page);color:var(--ink);overflow-x:hidden}
h1,h2,h3{font-family:'Montserrat',sans-serif;font-weight:900;letter-spacing:-.5px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* progress bar + day rail */
#bar{position:fixed;top:0;left:0;height:5px;width:0;background:var(--gold);z-index:50;transition:background .4s}
#rail{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:10px;padding:12px 8px;border-radius:30px;background:rgba(10,10,10,.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
#rail a{width:12px;height:12px;border-radius:50%;background:var(--c);opacity:.5;transition:transform .3s,opacity .3s;border:1px solid rgba(255,255,255,.35)}
#rail a.cur{transform:scale(1.7);opacity:1}

/* hero */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:8vh 8vw;background:radial-gradient(circle at 30% 40%,#1a1a1a 0%,var(--page) 70%)}
.hero{position:relative}.hlogo{position:absolute;right:6vw;top:0;bottom:0;margin:auto 0;width:min(40vw,520px);height:auto;background:#fff;border-radius:30px;padding:22px;animation:float 5s ease-in-out infinite alternate;box-shadow:0 0 0 4px var(--gold),0 24px 60px rgba(0,0,0,.6)}
@media (max-width:760px){.hlogo{position:static;width:64vw;margin:0 0 28px}}
.hero .kick{color:#b0b0b0;font-weight:300;font-size:1.05rem;margin-bottom:18px}
.hero h1{font-size:clamp(3rem,10vw,8rem);line-height:1;background:linear-gradient(90deg,#fff,var(--gold),#fff) 0 0/200% 100%;animation:shine 5s linear infinite;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .zero{font-family:'Montserrat';font-weight:700;font-size:clamp(1.4rem,3.5vw,2.4rem);margin:22px 0 40px}
.dots{display:flex;gap:clamp(8px,2vw,18px)}
.dots i{width:clamp(22px,4.4vw,44px);height:clamp(22px,4.4vw,44px);border-radius:50%;background:#262626;border:2px solid #3a3a3a;animation:lit .6s forwards calc(.5s + var(--i)*.28s),wave 2.4s ease-in-out infinite calc(3.4s + var(--i)*.15s)}
@keyframes wave{50%{transform:translateY(-14px)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes lit{to{background:var(--c);border-color:var(--c);box-shadow:0 0 22px var(--c)}}
.cue{margin-top:44px;color:#b0b0b0;font-weight:300}

/* day sections */
.day{--bgc:color-mix(in srgb,var(--ac) 13%,#0a0a0a);position:relative;padding:16vh 7vw 16vh calc(clamp(18px,4vw,60px) + 40px);background:var(--bgc);color:var(--ink)}
.day.light{--bgc:#f2f2f2;color:#111}
.head{margin-bottom:9vh;max-width:760px}
.num{font-family:'Montserrat';font-weight:900;font-size:clamp(5rem,20vw,15rem);line-height:.9;color:transparent;-webkit-text-stroke:2px var(--ac);transition:color .9s}
.day.in .num{color:var(--ac)}
.head h2{font-size:clamp(2rem,5vw,3.4rem);margin-top:6px}
.head .sub{font-family:'Montserrat';font-weight:700;color:var(--ac);font-size:1.1rem;margin:6px 0 18px}
.light .head .sub{color:#555}
.head p{font-weight:300;font-size:1.2rem;line-height:1.7;max-width:60ch;opacity:.9}

.scenes{position:relative;max-width:700px;padding-left:34px;border-left:3px solid color-mix(in srgb,var(--ac) 28%,transparent)}
.fill{position:absolute;left:-3px;top:0;width:3px;height:0;background:var(--ac)}
.fill::after{content:"";position:absolute;left:-8px;bottom:-9px;width:19px;height:19px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 30%,transparent),0 0 26px var(--ac)}
.scene{position:relative;padding:0 0 11vh;opacity:.22;transition:opacity .6s}
.scene:last-child{padding-bottom:0}
.scene.on{opacity:1}
.scene::before{content:"";position:absolute;left:-44px;top:7px;width:13px;height:13px;border-radius:50%;background:var(--bgc);border:3px solid var(--ac);transition:background .4s}
.scene.on::before{background:var(--ac)}
.scene h3{font-size:clamp(1.3rem,3vw,1.8rem);margin-bottom:8px}
.scene p{font-weight:300;font-size:1.1rem;line-height:1.75;max-width:56ch}

/* finale */
.end{min-height:80svh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:10vh 8vw;background:radial-gradient(circle at 70% 60%,#1a1a1a,var(--page) 70%)}
.end h2{font-size:clamp(2.2rem,6vw,4.5rem);max-width:15ch;line-height:1.1;margin-bottom:20px}
.end p{color:#b0b0b0;font-weight:300;font-size:1.15rem;margin-bottom:34px}
.btn{background:var(--gold);color:#000;font-weight:700;padding:14px 34px;border-radius:30px;transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(212,175,55,.6)}

/* ambient motion */
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fx b{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:var(--ac);opacity:.22;animation:drift var(--t) ease-in-out infinite alternate;animation-delay:var(--d)}
.light .fx b{opacity:.1}
@keyframes drift{to{transform:translate(var(--dx),-70px) scale(1.6)}}
.head,.scenes{position:relative;z-index:1}
.icon{position:absolute;right:7vw;top:12vh;width:clamp(90px,16vw,220px);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45));opacity:.9;z-index:1;animation:float 4s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-24px) rotate(7deg)}}
@media (max-width:700px){.icon{opacity:.3}}

@keyframes hop{to{transform:translateY(-7px) rotate(-8deg)}}
.scene p span{display:inline-block;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;transition-delay:calc(var(--w)*45ms)}
.scene.on p span{opacity:1;transform:none}
#ctl{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:50;display:flex;gap:10px;flex-wrap:wrap}
#mot{background:rgba(10,10,10,.8);color:#f4f4f4;border:1px solid rgba(255,255,255,.3)}
#play,#mot{border-radius:30px;padding:12px 22px;font:700 .9rem 'Poppins',sans-serif;cursor:pointer}
#play{background:var(--gold);color:#000;border:0;border-radius:30px;padding:12px 22px;font:700 .9rem 'Poppins',sans-serif;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)}

.calm,.calm *{scroll-behavior:auto}.calm *,.calm *::before{animation:none!important;transition:none!important}.calm .scene p span{opacity:1;transform:none}

/* cinematic day films */
.film-wrap{position:relative;z-index:2;max-width:1040px;margin:12vh 0 0}
.film-kicker{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--ac);font-size:.76rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.film-kicker:before{content:"";width:34px;height:1px;background:currentColor}
.film-card{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:24px;background:linear-gradient(135deg,#171717,#050505 70%);box-shadow:0 28px 80px rgba(0,0,0,.38)}
.film-card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 0%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 55%);z-index:1}
.film-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:22px 26px 16px;color:#fff}
.film-title{font:900 clamp(1.15rem,2.5vw,1.65rem) 'Montserrat',sans-serif;letter-spacing:-.04em}
.film-tag{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#c8c8c8;border:1px solid #ffffff30;border-radius:30px;padding:7px 11px;white-space:nowrap}
.film-screen{position:relative;z-index:2;padding:0 12px 12px}
.film-screen video{display:block;width:100%;aspect-ratio:16/9;max-height: min(68vw,650px);object-fit:contain;background:#050505;border-radius:15px}
.film-bottom{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 26px 22px;color:#bcbcbc;font-size:.82rem}
.film-bottom strong{color:#fff;font-weight:600}
#sound{background:rgba(10,10,10,.86);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:30px;padding:12px 18px;font:700 .86rem 'Poppins',sans-serif;cursor:pointer}
#sound[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#000}
.light .film-card{background:linear-gradient(135deg,#292929,#080808)}
@media(max-width:700px){.film-wrap{margin-top:9vh}.film-top{padding:18px 16px 13px}.film-screen{padding:0 8px 8px}.film-bottom{padding:8px 16px 17px;align-items:flex-start;flex-direction:column}.film-tag{font-size:.58rem}}

</style>
</head>

["Start From Zero","Broadway is where I work, and where I keep asking: how do I make enough to live and still have time for what I love?"],
["The Rat Race","An unexpected four hundred dollar expense hits and I’m back on the wheel, chasing the cheese. So I put what comes in next to what goes out."],
["Thinking More","A yellow notice on my doorknob. Pay up or leave. I weigh school, trade training or the military by cost, time and the skills I’d keep."],
["Up at Night","Two dreams. In the first, I’ve given up on music. In the second, I take a different road and a new house is waiting at the end."],
["Wake Up Motivated","An ad for the Notes for Goats transformation looks just like my dream. I can take the first step today."],
["Walk a New Road","I let go of what I’ve been holding to make room for something new, and I walk through the door."],
["Plan of Action","I came in with bills and no plan. I leave with a first step on the calendar. Next up, Red Day."]]],

["Target","One goal. A written starting point. Thirty minutes of my own practice, logged so I can compare next time."],
["Brains","Two poses, two messages. My words, voice and posture all say something. In DOWN, I match colors to their meanings."],
["Body","A fresh towel, water, and a pace I can keep. Then I cool down and log what I actually did."],
["Food","A plate I enjoy, a serving size I check, and room for the foods I love."],
["What’s Inside","Sleep, movement, food and water on the same page. One habit at a time."],
["Lights Camera","I record a short introduction and keep the take that tells my story. Next up, Orange Day."]]],

["Investments","Time, money and interest. Out of pocket, a loan, or a label advance? Interest never sleeps. I do."],
["Formula 2 Succeed","A personal profile and a business profile show who I am and what the money will help me finish."],
["What Is Music Biz?","Sony, Universal, Warner. Spotify, Apple Music, SoundCloud. TuneCore and DistroKid in between."],
["Label Structure","A release moves through A&R, marketing, licensing, legal and finance. Publishing is its own business."],
["Meet the Author","Andre Deyo’s discography becomes a timeline model for my own."],
["Pac-Man","The goal looks close, but I still have to collect knowledge. The fastest ghost is me getting in my own way."],
["Collaborate","A demo, a one-page brief and two collaborators. Next up, Yellow Day."]]],

["Studio Layout","Height, width, length. Then a sketch for the desk, speakers and mic."],

["Environment","Clear the desk, silence the phone, listen for fan noise. Record ten seconds first."],

var IC=[L.dollar,L.diamond,L.silver,L.dollar,L.silver,L.silver,L.diamond,L.dollar,L.diamond];
function W(t){return t.split(" ").map(function(w,i){return '<span style="--w:'+i+'">'+w+'</span>'}).join(" ")}
function B(){var h="";for(var k=0;k<16;k++){h+='<b style="--x:'+(Math.random()*100)+'%;--y:'+(Math.random()*100)+'%;--s:'+(8+Math.random()*34)+'px;--t:'+(5+Math.random()*7)+'s;--d:-'+(Math.random()*8)+'s;--dx:'+(Math.random()*80-40)+'px"></b>'}return h}
var story=document.getElementById("story"),rail=document.getElementById("rail"),dots=document.getElementById("dots"),secs=[],scs=[];
D.forEach(function(d,i){
  var n=("0"+i).slice(-2),c=d[1],cl=d[0]=="White"?"#fff":c;
  var s=document.createElement("section");
  s.className="day"+(d[0]=="White"?" light":"");s.id="day"+i;s.style.setProperty("--ac",c);
  s.innerHTML='<div class="fx" aria-hidden="true">'+B()+'</div><img class="icon" alt="" src="'+IC[i]+'"><div class="head"><div class="num">'+n+'</div><h2>'+d[0]+' Day</h2><div class="sub">'+d[2]+'</div><p>'+d[3]+'</p></div><div class="scenes"><div class="fill"></div>'+
    d[4].map(function(x){return '<div class="scene"><h3>'+x[0]+'</h3><p>'+W(x[1])+'</p></div>'}).join("")+'</div>'+
    '<div class="film-wrap"><div class="film-kicker">The day film · chapter '+n+'</div><div class="film-card"><div class="film-top"><div class="film-title">'+d[0]+' Day — In Motion</div><span class="film-tag">Original narration</span></div><div class="film-screen"><video controls playsinline preload="metadata" aria-label="'+d[0]+' Day narration video"><source src="narration/'+n+'-'+d[0].toLowerCase()+'-narration-only.mp4" type="video/mp4">Your browser does not support this video.</video></div><div class="film-bottom"><span><strong>Watch this chapter.</strong> Let the story unfold, one day at a time.</span><span>Use the player controls for sound and fullscreen</span></div></div></div>';
  story.appendChild(s);secs.push(s);
  var a=document.createElement("a");a.href="#day"+i;a.title=d[0]+" Day";a.setAttribute("aria-label",d[0]+" Day");a.style.setProperty("--c",cl);rail.appendChild(a);
  var o=document.createElement("i");o.style.setProperty("--c",cl);o.style.setProperty("--i",i);dots.appendChild(o);
});
var bar=document.getElementById("bar"),links=rail.children,vh=innerHeight,tick=false;
var reduce=false;
function update(){
  tick=false;vh=innerHeight;
  var max=document.documentElement.scrollHeight-vh;
  bar.style.width=(max>0?scrollY/max*100:0)+"%";
  var cur=-1;
  secs.forEach(function(s,i){
    var r=s.getBoundingClientRect();
    if(r.top<vh*.5)cur=i;
    if(r.top<vh*.7)s.classList.add("in");
    var sc=s.querySelector(".scenes"),sr=sc.getBoundingClientRect();
    var h=Math.max(0,Math.min(sr.height,vh*.62-sr.top));
    sc.firstChild.style.height=h+"px";
    sc.querySelectorAll(".scene").forEach(function(e){
      if(reduce||e.getBoundingClientRect().top<vh*.62)e.classList.add("on");else e.classList.remove("on");
    });
  });
  for(var k=0;k<links.length;k++)links[k].classList.toggle("cur",k===cur);
  bar.style.background=cur>=0?(D[cur][0]=="White"?"#fff":D[cur][1]):"var(--gold)";
  if(cur===0)bar.style.background="#fff";
}
function req(){if(!tick){tick=true;requestAnimationFrame(update)}}
var mb=document.getElementById("mot");mb.onclick=function(){reduce=!reduce;document.body.classList.toggle("calm",reduce);mb.textContent=reduce?"Motion: off":"Motion: on";mb.setAttribute("aria-pressed",reduce);req()};
var pb=document.getElementById("play"),playing=false,pos=0,last=0;
function stop(){playing=false;pb.textContent="▶ Play story"}
function step(t){if(!playing)return;pos+=(t-last)*0.07;last=t;
  var max=document.documentElement.scrollHeight-innerHeight;
  if(pos>=max){scrollTo({top:max,behavior:"instant"});stop();return}
  scrollTo({top:pos,behavior:"instant"});requestAnimationFrame(step)}
pb.onclick=function(){if(playing){stop();return}
  if(scrollY>=document.documentElement.scrollHeight-innerHeight-5)scrollTo({top:0,behavior:"instant"});
  playing=true;pos=scrollY;last=performance.now();pb.textContent="❚❚ Pause";requestAnimationFrame(step)};
var score=document.getElementById("score"),sb=document.getElementById("sound");
sb.onclick=function(){
  if(score.paused){score.volume=.22;score.play().then(function(){sb.textContent="♫ Soundtrack: on";sb.setAttribute("aria-pressed","true")}).catch(function(){sb.textContent="♫ Tap to retry soundtrack"})}
  else{score.pause();sb.textContent="♫ Soundtrack: off";sb.setAttribute("aria-pressed","false")}
};
document.querySelectorAll(".film-screen video").forEach(function(v){
  v.addEventListener("play",function(){document.querySelectorAll(".film-screen video").forEach(function(other){if(other!==v)other.pause()})});
});
document.addEventListener("visibilitychange",function(){if(document.hidden){score.pause();document.querySelectorAll(".film-screen video").forEach(function(v){v.pause()});sb.textContent="♫ Soundtrack: off";sb.setAttribute("aria-pressed","false")}});
["wheel","touchstart","keydown"].forEach(function(e){addEventListener(e,function(){if(playing)stop()},{passive:true})});
addEventListener("scroll",req,{passive:true});addEventListener("resize",req);update();
</script>
